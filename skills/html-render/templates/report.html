<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!-- TITLE: e.g. "Fleet BU Report, June 2026" --></title>
<style>
/* PM_CSS_EMBED: replace this comment with the full content of assets/brand-tokens.css
   (or your own brand CSS built on the same class names) */
</style>
</head>
<body>

<header class="pm-header">
  <div>
    <div class="pm-category"><!-- COMPANY --> · <!-- CATEGORY: e.g. "Sales Analysis" --></div>
    <h1><!-- TITLE --></h1>
    <div class="pm-subtitle"><!-- PERIOD: e.g. "FY2026 Q3 · April to June 2026" --></div>
  </div>
  <div class="pm-meta">
    <!-- DATE --><br>
    <!-- AUTHOR -->
  </div>
</header>

<!-- HIGHLIGHTS -->
<div class="pm-section pm-section-alt">
  <div class="pm-content-wide">
    <h2>Highlights</h2>
    <!--
      CONTENT_HIGHLIGHTS: 3-5 stat cards. Outcomes, not specs.
      <div class="pm-stat-grid">
        <div class="pm-stat-card">
          <div class="stat-value">$2.1M</div>
          <div class="stat-label">Fleet revenue</div>
          <div class="stat-trend up">+12% vs prior period</div>
        </div>
      </div>
    -->
  </div>
</div>

<!-- DATA -->
<div class="pm-section">
  <div class="pm-content-wide">
    <h2><!-- SECTION_TITLE: e.g. "Revenue by product line" --></h2>
    <!--
      CONTENT_TABLE:
      <div class="pm-table-wrap"><table class="pm-table">
        <thead><tr><th>Product</th><th>Revenue</th><th>vs prior</th><th>State</th></tr></thead>
        <tbody>
          <tr><td>CM-900</td><td>$420K</td><td>+18%</td><td><span class="pm-badge win">Growing</span></td></tr>
        </tbody>
      </table></div>
    -->
  </div>
</div>

<!-- ANALYSIS -->
<div class="pm-section pm-section-alt">
  <div class="pm-content">
    <h2>Analysis</h2>
    <!--
      CONTENT_ANALYSIS: prose paragraphs; .pm-callout (plain/warn/risk) for key
      findings; .pm-pull-quote for at most one sharp line per section.
      <p>Narrative here.</p>
      <div class="pm-callout"><strong>Win</strong>Positive finding.</div>
      <div class="pm-callout risk"><strong>Risk</strong>Risk finding.</div>
    -->
  </div>
</div>

<!-- ACTIONS -->
<div class="pm-section">
  <div class="pm-content-wide">
    <h2>Actions</h2>
    <!--
      CONTENT_ACTIONS: .pm-table with Owner / Due / Priority columns, priority
      as a meaning-bearing .pm-badge (win/warn/risk), never decorative.
    -->
  </div>
</div>

<footer class="pm-footer">
  <!-- FOOTER: source note + generation date, e.g. "Generated from outputs/analyses/sales-analysis-2026-06-10.md" -->
</footer>

</body>
</html>
