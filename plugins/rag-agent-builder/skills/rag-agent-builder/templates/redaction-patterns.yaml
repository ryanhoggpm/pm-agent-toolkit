name: "Redaction scan"

# Things that must not reach the index at all. Every one of these is a fact
# about your organisation, not about the platform, so this file is where the
# product-specific knowledge lives and the scanner stays generic.
#
# Fill in your own. The entries below are shapes that recur, with the reasoning
# kept because the reasoning is what transfers.

patterns:
  - name: "hardcoded credential"
    re: 'password[ \t]*[:=][ \t]*[A-Za-z0-9@!#$%^&*]{4,}'
    why: >-
      A working password in a published document is still a working password once
      the agent quotes it. Watch for vendor defaults in third-party guides.

  - name: "device serial or hardware identity"
    re: '\b<YOUR-OUI-PREFIX>[0-9A-F]{6}\b'
    why: >-
      Where a factory default credential is derived from a serial number,
      printing the serial prints the credential.

  - name: "lab or internal addressing"
    re: '\b10\.0\.1\.\d{1,3}\b|\b192\.168\.100\.\d{1,3}\b'
    why: >-
      Use documentation ranges instead: 192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24.

  - name: "API key or token literal"
    re: '\b(?:api[_-]?key|bearer|token)["\x27:= ]+[A-Za-z0-9_\-]{20,}'
    why: "Self-explanatory."

  - name: "component vendor or sourcing detail"
    re: '\b(?:<Vendor1>|<Vendor2>)\b'
    why: >-
      Silicon and supplier names are sourcing information. The part number a
      reader needs is fine; the vendor beside it usually is not.

  - name: "unreleased or roadmap language"
    re: '\b(?:will be available|coming soon|in a future release|planned for)\b'
    why: >-
      Reads as a commitment once retrieved without the release heading that
      dated it. Restrict the corpus to shipping capability.

footer: |
  Named individuals are not pattern-matchable. Check by hand.
